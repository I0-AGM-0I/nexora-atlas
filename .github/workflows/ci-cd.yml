name: NEXORA ATLAS CI/CD Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Stage 1: Static Analysis & Code Quality Gate
  # ============================================================================
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'apps/api/requirements.txt'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt

      - name: Run Backend Linting (Ruff)
        run: |
          ruff check apps/api

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'apps/web/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: |
          npm ci

      - name: Run Frontend Linting (ESLint)
        working-directory: apps/web
        run: |
          npm run lint

  # ============================================================================
  # Stage 2: Automated Test Execution Gate
  # ============================================================================
  test:
    name: Automated Unit & Integration Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'apps/api/requirements.txt'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt

      - name: Run Backend Pytest Suite
        working-directory: apps/api
        run: |
          python -m pytest -q

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'apps/web/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: |
          npm ci

      - name: Run Frontend Vitest Suite
        working-directory: apps/web
        run: |
          npm test -- --run

  # ============================================================================
  # Stage 3: Container Build Validation Gate
  # ============================================================================
  docker-build:
    name: Docker Image Build Validation
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Unified Production Image
        run: |
          docker build \
            --build-arg VITE_COMMIT_SHA=${{ github.sha }} \
            -t nexora-atlas:${{ github.sha }} .

  # ============================================================================
  # Stage 4: Production Deployment Gate (Master Branch Only)
  # ============================================================================
  deploy:
    name: Production Deployment
    needs: docker-build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deployment
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL secret is not yet configured in repository settings. Deployment hook skipped until Render Web Service is created."
            exit 0
          fi
          echo "Triggering Render deployment webhook..."
          curl -fsS -X POST "$DEPLOY_HOOK_URL"
          echo "Render deployment triggered successfully."
